spring.application.name=mystudentguide-api


# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# DATABASE - MYSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mystudentguide?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# Les logs SQL sont activés uniquement avec le profil "dev" (application-dev.properties)
spring.jpa.show-sql=false

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.mystudentguide=INFO

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================
# JWT
# ==========================================
# En production, JWT_SECRET doit être défini (32 caractères minimum)
jwt.secret=${JWT_SECRET:MyStudentGuideSecretKey2026ChangeThisInProduction123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# CORS - origines autorisées (séparées par des virgules)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.jpa.open-in-view=false


# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================

# Adresse Gmail utilisée par MyStudentGuide pour envoyer les emails
spring.mail.host=smtp.gmail.com

# Port SMTP sécurisé de Gmail
spring.mail.port=587

# Adresse Gmail de l'application
spring.mail.username=${MAIL_USERNAME:TON_ADRESSE_GMAIL@gmail.com}

# Mot de passe d'application Google
spring.mail.password=${MAIL_PASSWORD:TON_MOT_DE_PASSE_APPLICATION}

# Authentification SMTP
spring.mail.properties.mail.smtp.auth=true

# Sécurisation de la connexion avec STARTTLS
spring.mail.properties.mail.smtp.starttls.enable=true

# Vérifie le certificat du serveur SMTP
spring.mail.properties.mail.smtp.starttls.required=true
