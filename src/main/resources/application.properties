spring.application.name=mystudentguide-api


# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# DATABASE - MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/mystudentguide?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================
# JWT
# ==========================================
jwt.secret=MyStudentGuideSecretKey2026ChangeThisInProduction123456
jwt.expiration=86400000