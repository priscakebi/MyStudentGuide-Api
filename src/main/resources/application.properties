spring.application.name=mystudentguide-api

# ==========================================
# VARIABLES LOCALES (.env)
# ==========================================
# En local, les variables (JWT_SECRET, DB_PASSWORD, MAIL_...) sont lues
# depuis le fichier .env à la racine du projet (copie de .env.example,
# jamais versionné). Le fichier est facultatif : sur Render, il n'existe
# pas et ce sont les variables d'environnement qui sont utilisées
# (elles restent prioritaires sur le fichier).
spring.config.import=optional:file:.env[.properties]


# ==========================================
# SERVER
# ==========================================
# En local, l'application utilise le port 8080.
# En production, Render fournit automatiquement
# la variable d'environnement PORT.
server.port=${PORT:8080}


# ==========================================
# DATABASE - MYSQL
# ==========================================
# En local, les valeurs par défaut permettent
# de se connecter à MySQL installé sur la machine.
# En production, Render fournira les variables
# DB_URL, DB_USERNAME et DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mystudentguide?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
# Met à jour automatiquement la structure de la
# base de données à partir des entités JPA.
spring.jpa.hibernate.ddl-auto=update

# Les requêtes SQL détaillées sont désactivées
# en dehors du profil de développement.
spring.jpa.show-sql=false

spring.jpa.open-in-view=false


# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.mystudentguide=INFO


# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


# ==========================================
# JWT
# ==========================================
# En production, JWT_SECRET doit être défini
# comme variable d'environnement dans Render.
#
# La valeur par défaut permet uniquement de
# continuer à travailler en local.
jwt.secret=${JWT_SECRET}

# Durée de validité du token : 24 heures.
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==========================================
# CORS
# ==========================================
# En local, Angular fonctionne sur le port 4200.
# En production, CORS_ALLOWED_ORIGINS sera
# configuré avec l'URL du frontend Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
# Adresse Gmail utilisée par MyStudentGuide
# pour envoyer les emails.
spring.mail.host=smtp.gmail.com

# Port SMTP sécurisé de Gmail.
spring.mail.port=587

# Adresse Gmail de l'application.
# La valeur réelle sera fournie par Render.
spring.mail.username=${MAIL_USERNAME:TON_ADRESSE_GMAIL@gmail.com}

# Mot de passe d'application Google.
# Ne jamais mettre le vrai mot de passe dans GitHub.
spring.mail.password=${MAIL_PASSWORD:TON_MOT_DE_PASSE_APPLICATION}

# Authentification SMTP.
spring.mail.properties.mail.smtp.auth=true

# Sécurisation de la connexion avec STARTTLS.
spring.mail.properties.mail.smtp.starttls.enable=true

# Exige l'utilisation de STARTTLS.
spring.mail.properties.mail.smtp.starttls.required=true


# ==========================================
# MOT DE PASSE OUBLIÉ
# ==========================================
# URL publique du frontend utilisée pour
# construire le lien de réinitialisation
# envoyé par email.
#
# En local :
# http://localhost:4200
#
# En production :
# URL du frontend déployé sur Render.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Durée de validité du lien de réinitialisation
# en minutes.
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# Délai minimal entre deux demandes de
# réinitialisation en secondes.
app.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}


# ==========================================
# EMAIL - BREVO (API HTTP)
# ==========================================
# Le plan gratuit de Render bloque le SMTP : les emails
# sont envoyés via l'API HTTPS de Brevo.
brevo.api-key=${BREVO_API_KEY:}

# ==========================================
# ADMINISTRATEUR CRÉÉ AU DÉMARRAGE
# ==========================================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.prenom=${ADMIN_PRENOM:Admin}
app.admin.nom=${ADMIN_NOM:MyStudentGuide}