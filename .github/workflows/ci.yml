name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mystudentguide
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://localhost:3306/mystudentguide?serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      # Clé factice, utilisée uniquement par les tests de la CI
      # (le test contextLoads démarre toute l'application).
      JWT_SECRET: ci-test-secret-not-used-in-production-0123456789-abcdefghijklmnopqrstuvwxyz

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: ./mvnw -B verify
